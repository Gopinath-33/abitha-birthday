<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Our Guestbook ❤️</title>
<meta name="description" content="A little shared wall of notes between us.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3d9fa">

<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="light">

<div id="loader" aria-hidden="true">
  <div class="loader-heart"></div>
  <div class="loader-text">opening the guestbook…</div>
</div>

<div class="floaters" id="floaters" aria-hidden="true"></div>

<button type="button" class="chat-fab" id="chat-fab-btn" aria-label="Chat with Cupid">💘</button>

<main class="page" id="page">

  <div class="topbar">
    <a href="index.html" class="icon-btn" aria-label="Back to countdown">←</a>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-toggle" aria-label="Switch to dark mode">🌙</button>
    </div>
  </div>

  <section class="glass-card">
    <p class="eyebrow">A Little Wall Of Notes</p>
    <h1 class="headline">Our Guestbook 💌</h1>
    <p class="quiz-question" style="font-size:0.95rem;">Leave a little note here — either of you, any time.</p>
    <div class="guestbook-banner hidden" id="guestbook-setup-banner"></div>

    <form id="guestbook-form" novalidate>
      <div class="field">
        <label for="guestbook-name">Your name</label>
        <input type="text" id="guestbook-name" name="name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="guestbook-note">Your note</label>
        <textarea id="guestbook-note" name="note" rows="3" required></textarea>
      </div>
      <div class="controls-row">
        <button type="submit" class="pill-btn" id="guestbook-send">Add to Guestbook 💌</button>
      </div>
      <p class="form-status" id="guestbook-status" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="glass-card section-gap">
    <h2 class="section-title">Notes So Far</h2>
    <p class="balloon-hint hidden" id="guestbook-empty">No notes yet — be the first. ✦</p>
    <div id="guestbook-list"></div>
  </section>

  <div class="controls-row section-gap">
    <a href="quiz.html" class="pill-btn secondary">Play a Little Quiz 💕</a>
    <a href="bucketlist.html" class="pill-btn secondary">Our Bucket List ✅</a>
  </div>
  <div class="controls-row" style="margin-top:12px;">
    <a href="rosegarden.html" class="pill-btn secondary">Rose Garden 🌹</a>
    <a href="heartcatch.html" class="pill-btn secondary">Heart Catch ❤️</a>
  </div>
  <div class="controls-row" style="margin-top:12px;">
    <a href="wheel.html" class="pill-btn secondary">Wheel of Love 🎡</a>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="js/config.js"></script>
<script src="js/effects.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/guestbook.js"></script>

<div class="modal-overlay" id="chat-overlay">
  <div class="modal-card chat-modal-card">
    <button class="icon-btn modal-close" id="chat-close" aria-label="Close">✕</button>
    <h2 class="modal-title">Chat with <span id="chat-bot-name">Cupid</span> 💘</h2>
    <div class="chat-window" id="chat-window"></div>
    <form id="chat-form" class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Say something…" autocomplete="off">
      <button type="submit" class="chat-send-btn" id="chat-send">Send</button>
    </form>
  </div>
</div>

</body>
</html>
