<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Puzzle Piece Photo — Sample</title>
<meta name="theme-color" content="#2d1b3d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #e8749a; --rose-soft: #ffd6e8;
    --orchid: #9b5de5; --orchid-deep: #6c2e8c;
    --gold: #e8c878; --gold-soft: #f4e3a1;
    --white-soft: #fff9fb; --ink: #3a2140; --ink-soft: #6c5570;
    --bg-1: #fff0f6; --bg-2: #f3d9fa; --bg-3: #ffe3ec;
    --glass-bg: rgba(255,255,255,0.38);
    --glass-border: rgba(255,255,255,0.55);
    --glass-shadow: 0 8px 32px rgba(108,46,140,0.18);
    --font-display: "Playfair Display", Georgia, serif;
    --font-script: "Dancing Script", cursive;
    --font-body: "Poppins", "Segoe UI", sans-serif;
    --radius-lg: 28px; --radius-md: 18px; --radius-sm: 12px;
    --ease: cubic-bezier(0.22,1,0.36,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg-1), var(--bg-2) 55%, var(--bg-3));
    min-height: 100vh;
    display: flex; justify-content: center;
    padding: 32px 16px 60px;
  }
  main { width: 100%; max-width: 480px; }

  .glass-card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: var(--glass-shadow);
    padding: 26px 22px;
  }

  .section-title {
    font-family: var(--font-display);
    font-size: 1.3rem;
    color: var(--orchid-deep);
    text-align: center;
    margin-bottom: 4px;
  }
  .section-sub {
    text-align: center;
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }

  /* ---------- Progress ---------- */
  .progress-wrap { margin-bottom: 18px; }
  .progress-labels {
    display: flex; justify-content: space-between;
    font-size: 0.72rem; color: var(--ink-soft);
    margin-bottom: 6px; letter-spacing: 0.5px;
  }
  .progress-track {
    width: 100%; height: 8px; border-radius: 999px;
    background: rgba(155,93,229,0.15); overflow: hidden;
  }
  .progress-fill {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, var(--rose), var(--orchid), var(--gold));
    width: 0%; transition: width 0.8s var(--ease);
  }

  /* ---------- Puzzle frame ---------- */
.puzzle-frame {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: var(--radius-md);
    overflow: hidden;
    border: 3px solid var(--gold);
    box-shadow: 0 10px 30px rgba(108,46,140,0.3);
    margin-bottom: 20px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 0;
    background: var(--orchid-deep);
  }
  .piece {
    position: relative;
    background-image: url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=900&auto=format&fit=crop');
    background-size: 300% 300%;
    overflow: hidden;
  }
  .piece-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-size: 1.1rem;
    color: var(--white-soft);
    background: linear-gradient(150deg, var(--orchid), var(--orchid-deep));
    backdrop-filter: blur(2px);
    transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
  }
  .piece-overlay .lock-icon { font-size: 1.3rem; }
  .piece.unlocked .piece-overlay {
    opacity: 0;
    transform: scale(1.4) rotate(6deg);
    pointer-events: none;
  }
  .piece.unlocked { animation: pieceReveal 0.6s var(--ease); }
  @keyframes pieceReveal {
    0% { filter: brightness(1.6) saturate(0.4); }
    100% { filter: brightness(1) saturate(1); }
  }

  .puzzle-hint {
    text-align: center;
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }

  /* ---------- Balloon field ---------- */
  .balloon-field {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px 10px;
    justify-items: center;
    margin-bottom: 6px;
  }
  .balloon {
    width: 46px; height: 58px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    position: relative;
    transition: transform 0.25s var(--ease), opacity 0.3s var(--ease);
    animation: balloonBob 3s ease-in-out infinite;
  }
  .balloon::after {
    content: ""; position: absolute; bottom: -14px; left: 50%;
    width: 1px; height: 14px; background: rgba(108,46,140,0.3);
    transform: translateX(-50%);
  }
  .balloon:nth-child(3n+1) { background: linear-gradient(160deg, var(--rose-soft), var(--rose)); animation-delay: 0s; }
  .balloon:nth-child(3n+2) { background: linear-gradient(160deg, #e0c6f5, var(--orchid)); animation-delay: 0.4s; }
  .balloon:nth-child(3n+3) { background: linear-gradient(160deg, var(--gold-soft), var(--gold)); animation-delay: 0.8s; }
  @keyframes balloonBob {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-8px) rotate(2deg); }
  }
  .balloon:hover { transform: scale(1.06); }
  .balloon.popped { transform: scale(1.6); opacity: 0; pointer-events: none; }

  /* ---------- Completion message ---------- */
  .puzzle-complete {
    text-align: center;
    margin-top: 18px;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.8s var(--ease), max-height 0.8s var(--ease), margin 0.8s var(--ease);
  }
  .puzzle-complete.show {
    opacity: 1;
    max-height: 200px;
    margin-top: 18px;
  }
  .puzzle-complete-title {
    font-family: var(--font-script);
    font-size: 1.6rem;
    color: var(--rose);
    margin-bottom: 6px;
  }
  .puzzle-complete-text {
    font-size: 0.92rem;
    line-height: 1.6;
    color: var(--ink);
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    max-width: 86vw; padding: 12px 18px; border-radius: 14px; z-index: 600;
    background: rgba(45,27,61,0.88); color: #fff;
    font-size: 0.9rem; text-align: center;
    opacity: 0; transition: opacity 0.35s ease;
    pointer-events: none;
  }

  @media (max-width: 360px) {
    .balloon-field { gap: 12px 6px; }
    .balloon { width: 40px; height: 50px; }
  }
</style>
</head>
<body>

<main>
  <section class="glass-card">
    <h1 class="section-title">Piece by Piece 🧩</h1>
    <p class="section-sub">Pop a balloon, unlock a piece of the picture</p>

    <div class="progress-wrap">
      <div class="progress-labels">
        <span>Pieces unlocked</span>
        <span id="puzzle-progress-label">0/9</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="puzzle-progress-fill"></div>
      </div>
    </div>

    <div class="puzzle-frame" id="puzzle-frame"></div>
    <p class="puzzle-hint" id="puzzle-hint">🎈 pop all the balloons to reveal the full photo</p>

    <div class="balloon-field" id="balloon-field"></div>

    <div class="puzzle-complete" id="puzzle-complete">
      <div class="puzzle-complete-title">You put it all together 💕</div>
      <p class="puzzle-complete-text">Just like this photo, every little piece of us adds up to something beautiful. Happy birthday, my love.</p>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  // ---- Config for this sample ----
  const GRID = 3; // 3x3 = 9 pieces. Change to 4 for a harder 16-piece puzzle.
  const TOTAL = GRID * GRID;
  // Replace with your own photo, e.g. "assets/images/puzzle.jpg"
 const PHOTO_URL = "assets/images/abiii.jpeg";
  const REVEAL_MESSAGES = [
    "One piece down ✨", "Getting somewhere 💫", "Keep going 🎈",
    "More than halfway 💕", "Almost whole again 🌸", "So close now ✨",
    "One more to go…", "Nearly there 💗", "Last piece!"
  ];

  const frame = document.getElementById("puzzle-frame");
  const balloonField = document.getElementById("balloon-field");
  const hint = document.getElementById("puzzle-hint");
  const progressFill = document.getElementById("puzzle-progress-fill");
  const progressLabel = document.getElementById("puzzle-progress-label");
  const completeBox = document.getElementById("puzzle-complete");

  let unlockedCount = 0;
  // Shuffle the order pieces get revealed in, so it's not predictable.
  const revealOrder = shuffle([...Array(TOTAL).keys()]);

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ---- Build the puzzle grid ----
  for (let row = 0; row < GRID; row++) {
    for (let col = 0; col < GRID; col++) {
      const index = row * GRID + col;
      const piece = document.createElement("div");
      piece.className = "piece";
      piece.dataset.index = index;
      piece.style.backgroundImage = `url('${PHOTO_URL}')`;
      piece.style.backgroundPosition =
        `${(col / (GRID - 1)) * 100}% ${(row / (GRID - 1)) * 100}%`;

      const overlay = document.createElement("div");
      overlay.className = "piece-overlay";
      overlay.innerHTML = `<span class="lock-icon">🔒</span>`;
      piece.appendChild(overlay);
      frame.appendChild(piece);
    }
  }

  // ---- Build the balloons (one per piece) ----
  for (let i = 0; i < TOTAL; i++) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "balloon";
    b.setAttribute("aria-label", "Pop balloon");
    b.addEventListener("click", () => popBalloon(b));
    balloonField.appendChild(b);
  }

  function popBalloon(btn) {
    if (btn.classList.contains("popped") || unlockedCount >= TOTAL) return;
    btn.classList.add("popped");
    unlockPiece();
  }

  function unlockPiece() {
    const pieceIndex = revealOrder[unlockedCount];
    const piece = frame.querySelector(`.piece[data-index="${pieceIndex}"]`);
    if (piece) piece.classList.add("unlocked");

    unlockedCount++;
    progressFill.style.width = (unlockedCount / TOTAL) * 100 + "%";
    progressLabel.textContent = `${unlockedCount}/${TOTAL}`;

    const msg = REVEAL_MESSAGES[Math.min(unlockedCount - 1, REVEAL_MESSAGES.length - 1)];
    showToast(msg);

    if (unlockedCount >= TOTAL) {
      hint.textContent = "🎉 the whole picture is yours";
      setTimeout(() => completeBox.classList.add("show"), 400);
    }
  }

  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.style.opacity = "1";
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { toast.style.opacity = "0"; }, 1800);
  }
})();
</script>

</body>
</html>
