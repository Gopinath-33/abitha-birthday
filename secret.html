<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>For You Only 🔒</title>
<meta name="description" content="A locked page, just for her.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2d1b3d">

<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Dancing+Script:wght@600;700&family=Caveat:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>
  /* Secret page — reuses the site's existing design tokens (--rose,
     --orchid-deep, --gold, --glass-*, --font-*) from style.css so it
     matches every other page instead of hardcoding its own colors. */

  .secret-wrap {
    max-width: 760px;
    width: 100%;
    margin: 0 auto;
  }

  .secret-wrap .glass-card {
    max-width: 100%;
  }

  #page.secret-wrap {
    box-sizing: border-box;
  }

  body {
    width: 100%;
  }

  .secret-lock-screen {
    text-align: center;
    padding: 48px 24px;
  }

  .secret-lock-icon {
    font-size: 3rem;
    margin-bottom: 18px;
    display: block;
  }

  .secret-lock-icon.shake {
    animation: secret-shake 0.4s ease;
  }

  @keyframes secret-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .secret-title {
    font-family: var(--font-script);
    font-size: 1.9rem;
    color: var(--orchid-deep);
    margin-bottom: 6px;
  }
  [data-theme="dark"] .secret-title { color: var(--gold-soft); }

  .secret-sub {
    font-family: var(--font-display);
    font-style: italic;
    color: var(--ink-soft);
    font-size: 0.9rem;
    margin-bottom: 26px;
  }

  .secret-input-row {
    display: flex;
    gap: 10px;
    max-width: 320px;
    margin: 0 auto;
  }

  .secret-input-row input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: rgba(255, 255, 255, 0.55);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 0.95rem;
    text-align: center;
    outline: none;
    transition: border 0.25s;
  }
  [data-theme="dark"] .secret-input-row input {
    background: rgba(255, 255, 255, 0.08);
    color: var(--ink);
  }
  .secret-input-row input:focus { border-color: var(--rose); }

  .secret-input-row input.error {
    border-color: var(--rose);
    animation: secret-shake 0.4s ease;
  }

  .secret-error-msg {
    margin-top: 14px;
    font-size: 0.85rem;
    color: var(--rose);
    min-height: 1.2em;
  }

  .secret-hint {
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }

  .secret-content {
    display: none;
    width: 100%;
  }

  .secret-content.unlocked {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 26px;
  }

  .secret-stage {
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
  }

  .secret-stage.revealed {
    opacity: 1;
    transform: translateY(0);
  }

  .secret-stage-title {
    font-family: var(--font-script);
    font-size: 1.5rem;
    color: var(--rose);
    margin-bottom: 14px;
    text-align: center;
  }

  .secret-stage-text {
    font-family: var(--font-body);
    font-size: 0.98rem;
    line-height: 1.85;
    color: var(--ink);
    white-space: pre-line;
  }

  .secret-media {
    margin-top: 4px;
    text-align: center;
  }

  .secret-media img,
  .secret-media video {
    max-width: 100%;
    border-radius: var(--radius-md);
    box-shadow: var(--glass-shadow);
    border: 1px solid var(--glass-border);
  }

  .secret-media-caption {
    margin-top: 10px;
    font-family: var(--font-script);
    font-size: 1.1rem;
    color: var(--rose);
  }

  .secret-back {
    text-align: center;
    margin-top: 6px;
  }

  .audio-surprise-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 10px 0;
  }
  .audio-play-btn {
    width: 62px;
    height: 62px;
    flex-shrink: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, var(--rose), var(--orchid));
    color: #fff;
    font-size: 1.3rem;
    box-shadow: 0 8px 24px rgba(155, 93, 229, 0.5);
    transition: transform 0.25s var(--ease);
  }
  .audio-play-btn:hover { transform: scale(1.06); }
  .audio-play-btn:active { transform: scale(0.94); }
  .audio-surprise-bars {
    display: flex;
    align-items: center;
    gap: 4px;
    height: 32px;
  }
  .audio-surprise-bars span {
    width: 4px;
    height: 8px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--rose), var(--orchid));
    animation: audioBar 1s ease-in-out infinite;
    animation-play-state: paused;
  }
  .audio-surprise-bars span:nth-child(1) { animation-delay: 0s; }
  .audio-surprise-bars span:nth-child(2) { animation-delay: 0.15s; }
  .audio-surprise-bars span:nth-child(3) { animation-delay: 0.3s; }
  .audio-surprise-bars span:nth-child(4) { animation-delay: 0.45s; }
  .audio-surprise-bars span:nth-child(5) { animation-delay: 0.6s; }
  .audio-surprise-wrap.playing .audio-surprise-bars span {
    animation-play-state: running;
  }
  @keyframes audioBar {
    0%, 100% { height: 8px; }
    50% { height: 28px; }
  }
</style>
</head>
<body data-theme="light">

<div class="floaters" id="floaters" aria-hidden="true"></div>

<main class="page secret-wrap" id="page">

  <div class="topbar">
    <a href="index.html" class="icon-btn" aria-label="Back to countdown">←</a>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme-toggle" aria-label="Switch to dark mode">🌙</button>
    </div>
  </div>

  <section class="glass-card secret-lock-screen" id="secret-lock-screen">
    <span class="secret-lock-icon" id="secret-lock-icon">🔒</span>
    <h1 class="secret-title">For You Only</h1>
    <p class="secret-sub">You know the word. Type it below.</p>
    <div class="secret-input-row">
      <input type="text" id="secret-password-input" placeholder="…" autocomplete="off" autocapitalize="off">
      <button class="pill-btn" id="secret-unlock-btn">Unlock</button>
    </div>
    <p class="secret-error-msg" id="secret-error-msg"></p>
    <p class="secret-hint" id="secret-hint"></p>
  </section>

  <div class="secret-content" id="secret-content">

    <section class="glass-card secret-stage" id="secret-stage-letter">
      <h2 class="secret-stage-title">Something I've never said</h2>
      <p class="secret-stage-text" id="secret-letter-text"></p>
    </section>

    <section class="glass-card secret-stage" id="secret-stage-vision">
      <h2 class="secret-stage-title">Where I see us</h2>
      <p class="secret-stage-text" id="secret-vision-text"></p>
    </section>

    <section class="glass-card section-gap">
      <h2 class="section-title">A Surprise For You 🎥</h2>
      <div class="video-frame" id="video-frame" style="aspect-ratio:16/9;">
        <iframe
          id="surprise-video"
          src="https://drive.google.com/file/d/1c6LQYn2TCOFnC-5qjy3sqYKOQ2CMa36Q/preview"
          allow="autoplay"
          allowfullscreen
          style="position:absolute; inset:0; width:100%; height:100%; border:0;">
        </iframe>
      </div>
      <p class="video-caption" id="video-caption"></p>
    </section>

    <section class="glass-card section-gap">
      <h2 class="section-title">One More Thing, In My Voice 🎙️</h2>
      <div class="audio-surprise-wrap" id="secret-audio-wrap">
        <button type="button" class="audio-play-btn" id="secret-audio-play-btn" aria-label="Play voice message">
          <span id="secret-audio-play-icon">▶</span>
        </button>
        <div class="audio-surprise-bars" id="secret-audio-bars" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>
      <audio id="secret-audio" preload="none">
        <source src="assets/audio/abitha.mpeg" type="audio/mpeg">
      </audio>
      <p class="video-caption" id="secret-audio-caption"></p>
    </section>

    <div class="secret-back">
      <a href="index.html" class="pill-btn secondary">Back to the countdown</a>
    </div>

  </div>

</main>

<script src="js/config.js"></script>
<script src="js/effects.js"></script>
<script src="js/secret.js"></script>
</body>
</html>
